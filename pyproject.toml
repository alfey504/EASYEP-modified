[project]
name = "easy-ep2"
version = "0.1.0"
description = "EASY-EP expert selection with gate-weighted bias-vector replacement for MoE models"
readme = "README.md"
requires-python = ">=3.10"
# Lower bounds are deliberately loose so that preinstalled packages on hosted
# notebooks (e.g. Kaggle's CUDA build of torch) are reused instead of replaced.
dependencies = [
    "torch>=2.4",
    # transformers 5: fused-expert MoE layout used by the OLMoE plugin, `dtype=` kwarg
    "transformers>=5.20",
    # Multi-GPU placement (DEVICE_MAP)
    "accelerate>=1.0",
    # T5 tokenizer (switch-base-8)
    "sentencepiece>=0.2.0",
    "protobuf>=3.20",
    # Streaming C4 evaluation data
    "datasets>=2.19",
    # Custom checkpoint format
    "safetensors>=0.4.3",
    # Configuration
    "python-dotenv>=1.0.0",
    # Utilities
    "numpy>=1.26",
    "tqdm>=4.66",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moe_pruning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
